# MediSlot delivery pipeline
#
#   test ──┐
#          ├─► build ─► Trivy scan (gate) ─► push to GHCR (:<git-sha>) ─► GitOps deploy
#   web  ──┘                                                              (bump Helm values,
#                                                                          Argo CD syncs EKS)
#
# Third-party actions are pinned to full commit SHAs (supply-chain hardening); the
# trailing comment records the human-readable version.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- quality gate 1
  backend-test:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medislot
          POSTGRES_USER: medislot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medislot" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run pytest (fails the build on any test failure)
        run: pytest -v --cov --cov-report=term --cov-report=xml --junitxml=pytest-report.xml

      - name: Migration smoke test against real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://medislot:ci-only-password@localhost:5432/medislot
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/pytest-report.xml
            backend/coverage.xml

  # ---------------------------------------------------------------- quality gate 2
  frontend-build:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist

  # ------------------------------------------------- build ▸ scan ▸ push (per image)
  build-scan-push:
    name: Image · ${{ matrix.component }}
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload Trivy SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image reference (registry paths must be lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=${REGISTRY}/${owner}/medislot-${{ matrix.component }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (tagged with the commit SHA, never `latest`)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy report (SARIF for the GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Trivy gate — fail on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only images that passed the scan reach the registry)
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.ref }}"
          echo "### 📦 ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`${{ steps.image.outputs.ref }}\` (Trivy: no fixable HIGH/CRITICAL CVEs)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- GitOps deploy
  deploy:
    name: Deploy · GitOps (Argo CD)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the new image tag back to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point the EKS environment at the new images
        run: |
          yq -i '.backend.image.tag = strenv(GITHUB_SHA) | .frontend.image.tag = strenv(GITHUB_SHA)' \
            helm/medislot/values-eks.yaml
          git diff --stat

      - name: Commit and push the release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/medislot/values-eks.yaml
          git commit -m "deploy: release medislot ${GITHUB_SHA::7} to EKS [skip ci]"
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true && break
            fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ] || { echo "::error::could not push release commit"; exit 1; }
          {
            echo "### 🚀 Released \`${GITHUB_SHA::7}\`"
            echo "Argo CD detects the change in \`helm/medislot/values-eks.yaml\` and rolls it out to EKS."
          } >> "$GITHUB_STEP_SUMMARY"

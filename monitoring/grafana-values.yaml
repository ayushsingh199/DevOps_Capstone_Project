# kube-prometheus-stack — Grafana side (passed together with prometheus-values.yaml).
grafana:
  enabled: true
  # Admin credentials come from a Secret created by scripts/bootstrap-cluster.sh;
  # no password is ever committed.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # The MediSlot dashboard ConfigMap lives in the app namespace (shipped by the Helm chart).
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
  persistence:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

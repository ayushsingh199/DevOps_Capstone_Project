# Ingress controller (implements the Ingress resources in helm/medislot).
# Traefik is used because the community ingress-nginx project was retired in March 2026.
deployment:
  replicas: 1
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true # writes the load-balancer address into each Ingress status
  kubernetesCRD:
    enabled: false
service:
  type: LoadBalancer
  annotations:
    # On EKS: provision an internet-facing Network Load Balancer in the public subnets.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
metrics:
  prometheus:
    serviceMonitor:
      enabled: false
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 300m, memory: 192Mi }

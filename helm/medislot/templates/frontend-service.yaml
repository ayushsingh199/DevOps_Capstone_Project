apiVersion: v1
kind: Service
metadata:
  name: {{ include "medislot.componentName" (list . "frontend") }}
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
    {{- include "medislot.selectorLabels" (list . "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "medislot.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http

{{- if .Values.serviceMonitor.enabled }}
# SLO-style alerts evaluated by Prometheus (visible on its Alerts page).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "medislot.fullname" . }}-alerts
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
spec:
  groups:
    - name: medislot.rules
      rules:
        - alert: MediSlotBackendDown
          expr: sum(up{namespace="{{ .Release.Namespace }}", job="{{ include "medislot.componentName" (list . "backend") }}"}) < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No MediSlot backend pod is being scraped successfully.
        - alert: MediSlotHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of API requests are failing with 5xx.
        - alert: MediSlotSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", handler!="/metrics"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: p95 API latency has been above 500 ms for 10 minutes.
{{- end }}

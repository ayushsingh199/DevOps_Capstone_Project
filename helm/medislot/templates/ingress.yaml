{{- if .Values.ingress.enabled }}
# One entry point, two routes:  /api -> FastAPI backend,  / -> React frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medislot.fullname" . }}
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "medislot.componentName" (list . "backend") }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medislot.componentName" (list . "frontend") }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}

{{- $name := include "medislot.componentName" (list . "backend") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "medislot.labels" . | nindent 4 }}
    {{- include "medislot.selectorLabels" (list . "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "medislot.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medislot.labels" . | nindent 8 }}
        {{- include "medislot.selectorLabels" (list . "backend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ .Values.backend.runAsUser }}
        runAsGroup: {{ .Values.backend.runAsUser }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "medislot.selectorLabels" (list . "backend") | nindent 14 }}
      initContainers:
        # 1) block until PostgreSQL accepts connections
        - name: wait-for-db
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          # -U is required: this container runs as UID 10001, which has no passwd entry, so libpq
          # cannot derive a default user and pg_isready would report "no attempt" forever.
          command: ["sh", "-c", "until pg_isready -h {{ include "medislot.dbHost" . }} -p 5432 -U {{ .Values.postgresql.username }}; do echo waiting for db; sleep 2; done"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        # 2) apply Alembic migrations (advisory-locked, so parallel pods are safe)
        - name: migrate
          image: {{ include "medislot.image" (list . .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - alembic upgrade head{{ if .Values.backend.seedDemoData }} && python -m app.seed{{ end }}
          env:
            {{- include "medislot.backendEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ include "medislot.image" (list . .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.backend.port }}", "--proxy-headers", "--forwarded-allow-ips=*"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- include "medislot.backendEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

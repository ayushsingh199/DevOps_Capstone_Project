# Full local stack: `docker compose up --build`, then open http://localhost:3000
name: medislot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medislot
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medislot-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medislot -d medislot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: medislot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://medislot:${POSTGRES_PASSWORD:-medislot-local}@postgres:5432/medislot
      APP_VERSION: ${APP_VERSION:-local-dev}
      ENVIRONMENT: docker-compose
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: medislot-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

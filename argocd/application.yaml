# GitOps: Argo CD keeps the `medislot` namespace in sync with helm/medislot on main.
# CI changes the image tags in values-eks.yaml -> Argo CD notices -> rolling update.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medislot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ayushsingh199/DevOps_Capstone_Project.git
    targetRevision: main
    path: helm/medislot
    helm:
      releaseName: medislot
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medislot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

# Scenario 2 — Service with no endpoints: selector says `app: lab-web`, pods are `app: lab-frontend`.
# Diagnose: kubectl -n medislot-lab get endpointslices -l kubernetes.io/service-name=lab-web
#           kubectl -n medislot-lab get pods --show-labels
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-frontend
  namespace: medislot-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-frontend }
  template:
    metadata:
      labels: { app: lab-frontend }
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: medislot-lab
spec:
  selector:
    app: lab-web # <-- bug: matches no pods
  ports:
    - port: 80
      targetPort: 8080
